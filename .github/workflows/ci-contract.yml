name: DeepEP CI Contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: DeepEP / CI Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python -m pip install pyyaml==6.0.3
      - run: python -m unittest discover -s ci/tests -p 'test_*.py' -v
      - run: node --test ci/tests/test_github.cjs
      - run: bash -n ci/run_a5.sh
